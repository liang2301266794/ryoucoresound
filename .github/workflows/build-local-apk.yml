name: build-local-apk

# Fork-only helper: builds a debug-signed (installable) APK so the Chinese
# translation can be tried on a phone without a local Android/Rust toolchain.
# Debug builds use applicationIdSuffix ".debug", so they can be installed
# alongside the official release.
#
# - push to the local-apk branch  -> builds and uploads an artifact
# - push a zh-* tag               -> builds and publishes a prerelease with
#                                    the apk attached (public download, no login)

on:
  push:
    branches:
      - local-apk
    tags:
      - "zh-*"
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architecture"
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ARCH: ${{ inputs.arch || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: false
          arch: ${{ env.ARCH }}

      - name: Install just
        run: sudo snap install just --classic

      - name: Build debug apk
        run: just android::build debug "$ARCH"

      - name: Collect apk
        run: |
          set -euxo pipefail
          mkdir -p out
          find android/app/build/outputs -name "app-*-debug.apk" -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: openscq30-zh-debug-${{ env.ARCH }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/zh-')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: 中文测试版 ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            OpenSCQ30 简体中文测试版（debug 签名，可与官方版共存）。

            - 构建自提交 `${{ github.sha }}`
            - 包名 `com.oppzippy.openscq30.debug`，无需卸载官方版
            - 数据独立，首次使用需要重新配对耳机
