name: build-local-apk

# Fork-only helper: builds a debug-signed (installable) APK so the Chinese
# translation can be tried on a phone without a local Android/Rust toolchain.
# Debug builds use applicationIdSuffix ".debug", so they can be installed
# alongside the official release.
#
# Runs automatically when the local-apk branch is pushed. workflow_dispatch is
# also available once this file is on the default branch.

on:
  push:
    branches:
      - local-apk
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU architecture"
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ARCH: ${{ inputs.arch || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: false
          arch: ${{ env.ARCH }}

      - name: Install just
        run: sudo snap install just --classic

      - name: Build debug apk
        run: just android::build debug "$ARCH"

      - name: Collect apk
        run: |
          set -euxo pipefail
          mkdir -p out
          find android/app/build/outputs -name "app-*-debug.apk" -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: openscq30-zh-debug-${{ env.ARCH }}
          path: out/*.apk
          if-no-files-found: error
